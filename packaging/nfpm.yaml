# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
name: folder-lens
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: utils
priority: optional
maintainer: Mirano Galijasevic <mirano@live.com>
description: |-
  Find what uses disk space.
  Folder Lens is a native GTK4 application that scans folders without
  modifying their contents and presents a clear storage breakdown.
vendor: Folder Lens
homepage: https://github.com/mirano-galijasevic/folder-lens
license: MIT

contents:
  - src: target/release/folder-lens
    dst: /usr/bin/folder-lens
    file_info:
      mode: 0755
  - src: packaging/dev.folderlens.FolderLens.desktop
    dst: /usr/share/applications/dev.folderlens.FolderLens.desktop
    file_info:
      mode: 0644
  - src: packaging/dev.folderlens.FolderLens.metainfo.xml
    dst: /usr/share/metainfo/dev.folderlens.FolderLens.metainfo.xml
    file_info:
      mode: 0644
  - src: assets/folder-lens.png
    dst: /usr/share/pixmaps/folder-lens.png
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/folder-lens/LICENSE
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/folder-lens/README.md
    file_info:
      mode: 0644

overrides:
  deb:
    depends:
      - libgtk-4-1 (>= 4.10)
  rpm:
    depends:
      - gtk4 >= 4.10
  archlinux:
    depends:
      - gtk4

rpm:
  summary: Find what uses disk space
  group: Applications/System

archlinux:
  packager: Mirano Galijasevic <mirano@live.com>
