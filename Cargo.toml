[package]
name = "folder-lens"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Find what uses disk space"
license = "MIT"

[dependencies]
directories = "6"
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

